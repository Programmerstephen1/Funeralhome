services:
  - type: keyvalue
    name: funeralhome-redis
    plan: 256mb
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: funeralhome-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    # Expand schema only while the previous release may still be serving.
    # Run `flask --app run:app db upgrade` after the new release is healthy to
    # apply the contract migration that removes plaintext legacy PIN columns.
    preDeployCommand: cd backend && flask --app run:app db upgrade 0002_hardened_data
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://funeralhome-api.onrender.com
      - key: FORCE_HTTPS
        value: "True"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: funeralhome-redis
          property: connectionString
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_DSN
        sync: false
      - key: ENABLE_HSTS
        value: "True"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USE_SSL
        value: "True"
      - key: MAIL_USE_TLS
        value: "False"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
